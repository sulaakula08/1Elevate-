<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Same geometry as LogoMark, reversed out of a brand tile. The tab strip is
       near-white in one browser and near-black in the next, and this file is
       served statically so it cannot read the theme: the tile is what guarantees
       the mark keeps its contrast either way. Inset so the numeral clears the
       rounded corner. -->
  <rect width="28" height="28" rx="6.5" fill="#4f46e5"/>
  <g transform="translate(2.1 2.1) scale(0.85)">
    <rect x="3.2" y="19.2" width="6" height="5.3" rx="1" fill="#ffffff" opacity="0.5"/>
    <rect x="11" y="14.2" width="6" height="10.3" rx="1" fill="#ffffff" opacity="0.75"/>
    <path d="M18.8 24.5V8.9L15.6 11 14 7.7 20.6 3.5h4.2v21h-6Z" fill="#ffffff"/>
  </g>
</svg>
